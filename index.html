<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paleta de colores</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
             <h1 class="header-tittle">PALETA DE COLORES</h1>
         </div>
        
    </header>
     <div class="color-container">
            <div class="color-box" id="color1">
                 <input type="color" class="color-input" id="input-color1" value="#ff0000">
            </div>
            <div class="color-box" id="color2">
                    <input type="color" class="color-input" id="input-color2" value="#00ff00">
            </div>
            <div class="color-box" id="color3">
                    <input type="color" class="color-input" id="input-color3" value="#0000ff">
            </div>
            <div class="color-box" id="color4">
                    <input type="color" class="color-input" id="input-color4" value="#ffff00">
            </div>
            <div class="color-box" id="color5">
                    <input type="color" class="color-input" id="input-color5" value="#ff00ff">
            </div>
            
     </div>
     <div class="button-container">
            <button class="btn-generar" id="btn-generar">Generar Colores</button>
     </div>
      <div class="resultados-container" id="resultados-container">
            <h2>Colores Combinados</h2>
            <div class="resultados-grid" id="resultados-grid"></div>
     </div>
     
     <footer>
        <p>&copy; 2026 Paleta de Colores. Todos los derechos reservados.</p>
     </footer>

    <script src="script.js"></script>
</body>
</html>
