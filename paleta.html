<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paleta de colores</title>
    <link rel="icon" type="image/png" href="imagen/favicon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <h1 class="header-tittle">
                <a href="index.html">
                    <img src="imagen/paleta-color.png" width="50" height="50" alt="Icono paleta de colores">
                </a>
                PALETA DE COLORES
            </h1>
        </div>
    </header>

    <nav class="navbar">
        <div class="navbar-content">
            <div class="navbar-controls">
                <div class="control-group">
                    <label for="selectorTamaño">Tamaño:</label>
                    <select id="selectorTamaño">
                        <option value="6">6 colores</option>
                        <option value="8">8 colores</option>
                        <option value="9">9 colores</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="selectorFormato">Formato:</label>
                    <select id="selectorFormato">
                        <option value="hex">HEX</option>
                        <option value="hsl">HSL</option>
                        <option value="rgb">RGB</option>
                    </select>
                </div>

                <div class="control-group">
                    <label for="selectorArmonia">Armonía:</label>
                    <select id="selectorArmonia">
                        <option value="aleatorio">Aleatorio</option>
                        <option value="complementario">Complementario</option>
                        <option value="analogo">Análogo</option>
                        <option value="triadico">Triádico</option>
                        <option value="monocromatico">Monocromático</option>
                    </select>
                </div>
            </div>

            <div class="navbar-buttons">
                <button class="btn-generar" id="botonGenerar">Generar</button>
                <button class="btn-guardar" id="botonGuardar">Guardar</button>
                <button class="btn-favoritos" id="botonVerFavoritos">Favoritos</button>
                <button class="btn-simulador" id="botonSimulador">Simulador</button>
            </div>
        </div>
    </nav>

    <div class="ghost-container">
        <!-- Fantasma animado -->
        <div id="ghost">
            <div id="feedback" class="feedback"></div>
            <div id="ghost-message"></div>
            <div id="red">
                <div id="pupil"></div>
                <div id="pupil1"></div>
                <div id="eye"></div>
                <div id="eye1"></div>
                <div id="top0"></div>
                <div id="top1"></div>
                <div id="top2"></div>
                <div id="top3"></div>
                <div id="top4"></div>
                <div id="st0"></div>
                <div id="st1"></div>
                <div id="st2"></div>
                <div id="st3"></div>
                <div id="st4"></div>
                <div id="st5"></div>
                <div id="an1"></div>
                <div id="an2"></div>
                <div id="an3"></div>
                <div id="an4"></div>
                <div id="an5"></div>
                <div id="an6"></div>
                <div id="an7"></div>
                <div id="an8"></div>
                <div id="an9"></div>
                <div id="an10"></div>
                <div id="an11"></div>
                <div id="an12"></div>
                <div id="an13"></div>
                <div id="an14"></div>
                <div id="an15"></div>
                <div id="an16"></div>
                <div id="an17"></div>
                <div id="an18"></div>
            </div>
        </div>
    </div>

    <div class="resultados-container" id="contenedorResultados">
        <h2 class="text-resultados">Colores Generados</h2>
        <div class="resultados-grid" id="gridColores"></div>
    </div>

    <footer>
        <p>&copy; 2026 Paleta de Colores. Todos los derechos reservados.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
